<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="shortcut icon" href="img/logo.png" type="image/x-icon" />
        <!--Libreria iconos-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <title>Golden Padel</title>
    </head>
    <body>
    <!--Cabecera-->
    <header class="cabecera">
        <!--Contenedor del Logo-->
        <div class="logo">
            <a href="index.html" target="_self"><img src="img/logo.png" alt="logo"/></a>
        </div>
        <!--Contenedor cuadro de Búsqueda-->
        <form class="busqueda">
            <input type="search" name="#" placeholder="Buscar productos">
            <button type="submit" target="_self">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>
        <!--Contenedor de Acciones del Usuario-->
        <div class="acciones">
            <div class="idioma">
                <select>
                    <option>ES</option>
                    <option>EN</option>
                </select>
                <i class="fa-solid fa-arrow-down"></i>
            </div>
            <a href="usuario.html" target="_self"><i class="fa-solid fa-user" style="color: rgb(0, 0, 0);"></i></a>
            <a href="favoritos.html" target="_self"><i class="fa-solid fa-heart" style="color: rgb(0, 0, 0);"></i></a>
            <a href="carrito.html" target="_self"><i class="fa-solid fa-cart-shopping" style="color: rgb(0, 0, 0);"></i></a>
        </div>
    </header>

    <!--Contenedor de la Barra de Navegacion-->
    <div class="contenedor-menu">
        <div class="menu">
            <a href="#"><i class="fa-solid fa-bars"></i> Todas las categorías</a>
            
            <!--Menu lateral (Escondido)-->
            <div class="contenedor-lateral">
                <div class="cabecera-contenedor-lateral">
                    <h3>Golden Padel</h3>
                </div>
                <ul>
                    <li><a href="ropa.html" target="_self"><img src="img/ropa.png" alt=""> Ropa</a></li>
                    <li><a href="palas.html" target="_self"><img src="img/pala.png" alt=""> Palas</a></li>
                    <li><a href="pelotas.html" target="_self"><img src="img/pelotas.png" alt=""> Pelotas</a></li>
                    <li><a href="zapatillas.html" target="_self"><img src="img/zapatilla.png" alt=""> Zapatillas</a></li>
                    <li><a href="accesorios.html" target="_self"><img src="img/accesorios.png" alt=""> Accesorios</a></li>
                    <li><a href="formulario.html" target="_self"><img src="img/iconos/accesorios.png" alt=""> Accesorios</a></li>
                </ul>
            </div>
        </div>
    </div>
    
    <!--Contenedor del Panel Principal-->
    <section class="panel-formulario">
    <div class="contenedor-formulario">
        <h2>Registro en Newsletter</h2>
            <form action="mailto:diego.librado.lopez2004@gmail.com" method="get" enctype="application/x-www-form-urlencoded">
            <div class="casilla">
                <label for="nombre">Nombre y Apellidos</label>
                <input type="text" placeholder="Introduce tu nombre completo" required>
            </div>

            <div class="casilla">
                <label for="nacimiento">Fecha de Nacimiento</label>
                <input type="date" required>
            </div>

            <div class="casilla">
                <label for="email">Correo Electrónico</label>
                <input type="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="casilla">
                <label for="telefono">Teléfono</label>
                <input type="tel" placeholder="600 000 000" required>
            </div>

            <button type="submit" class="boton-enviar">Enviar Registro</button>
        </form>
    </div>
    </section>

    <!--Contenedor del Footer-->
    <footer class="pie">
        <p>© 2026 Golden Padel, Inc. Todos los derechos reservados</p>
    </footer>
  </body>
</html>
